---
- name: Install Development Stack Add-On (RPM Only)
  hosts: localhost
  connection: local
  vars_files:
    - vars/main.yml
  # Removed global 'become: true'. Privilege escalation is now targeted.

  tasks:
    - name: Confirm local-only execution
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'localhost'
          - ansible_connection == 'local'
        fail_msg: "This playbook is supported only for local workstation configuration. Remote inventory execution is intentionally unsupported."

    - name: Confirm supported Linux platform
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'RedHat'
          - ansible_facts['distribution_major_version'] == '9'
        fail_msg: "Unsupported platform. This playbook currently supports local RHEL-family 9 workstations only."

    # =====================================================================
    # SYSTEM CONFIGURATION (RUNS AS ROOT VIA SUDO)
    # =====================================================================
    - name: System Package and Repository Setup
      become: true
      block:
        - name: Ensure required base utilities are installed
          ansible.builtin.dnf:
            name: ['curl', 'git', 'jq']
            state: present

        - name: Install EPEL Release (RHEL-family only)
          ansible.builtin.dnf:
            name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm"
            state: present
          when: ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution'] != 'Fedora'

        - name: Add required RPM repositories
          ansible.builtin.yum_repository:
            name: "{{ item.name }}"
            description: "{{ item.desc }}"
            baseurl: "{{ item.url }}"
            enabled: true
            gpgcheck: true
            gpgkey: "{{ item.key }}"
          loop:
            - name: code
              desc: Visual Studio Code
              url: https://packages.microsoft.com/yumrepos/vscode
              key: https://packages.microsoft.com/keys/microsoft.asc
            - name: packages-microsoft-com-prod
              desc: Microsoft Packages Production (PowerShell)
              url: "{{ microsoft_repo_url }}"
              key: https://packages.microsoft.com/keys/microsoft.asc
            - name: hashicorp
              desc: HashiCorp Stable - $basearch
              url: "{{ hashicorp_repo_url }}"
              key: https://rpm.releases.hashicorp.com/gpg
          when: ansible_facts['os_family'] == 'RedHat'

        - name: Install ansible-core (Strictly from official OS repos)
          ansible.builtin.dnf:
            name: ansible-core
            state: present

        - name: Install Development Tooling via DNF
          ansible.builtin.dnf:
            name: "{{ base_tooling_packages + (['powershell'] if (install_powershell | bool) else []) }}"
            state: present
            update_cache: true

    # =====================================================================
    # USER CONFIGURATION (RUNS NATIVELY AS THE EXECUTING USER)
    # =====================================================================
    - name: Install VS Code extensions
      ansible.builtin.command:
        argv:
          - code
          - --install-extension
          - "{{ item }}"
      # No become_user or $HOME spoofing needed. Runs cleanly as the developer.
      register: vscode_ext_install
      changed_when: "'was successfully installed' in vscode_ext_install.stdout"
      failed_when:
        - vscode_ext_install.rc != 0
        - "'already installed' not in vscode_ext_install.stderr"
      loop: "{{ vscode_extensions + (['ms-vscode.powershell'] if (install_powershell | bool) else []) + ([codex_vscode_extension] if (install_codex | bool) else []) }}"

    - name: Install and configure AWS Agent Toolkit for Codex
      when: install_aws_agent_toolkit | bool
      block:
        - name: Require AWS default Region for Agent Toolkit setup
          ansible.builtin.assert:
            that:
              - aws_default_region is defined
              - aws_default_region | length > 0
            fail_msg: "Set aws_default_region before enabling install_aws_agent_toolkit, for example: -e 'install_aws_agent_toolkit=true aws_default_region=us-east-2'."

        - name: Explain AWS Agent Toolkit authentication behavior
          ansible.builtin.debug:
            msg:
              - "AWS Agent Toolkit setup uses aws login browser authentication."
              - "Do not provide AWS access keys or secret keys to this playbook."
              - "Credentials are valid for 12 hours and can be renewed for 90 days without re-authenticating in the browser."

        - name: Verify network access to AWS CLI downloads
          ansible.builtin.uri:
            url: https://awscli.amazonaws.com
            method: HEAD
            status_code:
              - 200
              - 301
              - 302
              - 403
            timeout: 15
          changed_when: false

        - name: Install or update AWS CLI v2 with AWS installer
          ansible.builtin.shell: |
            set -o pipefail
            curl -fsSL 'https://awscli.amazonaws.com/v2/install.sh' | bash
          args:
            executable: /bin/bash
          register: aws_cli_install
          changed_when: aws_cli_install.rc == 0

        - name: Persist local bin on PATH for future shells
          ansible.builtin.lineinfile:
            path: "{{ aws_shell_rc_path }}"
            line: 'export PATH="$HOME/.local/bin:$PATH"'
            create: true
            mode: '0644'

        - name: Verify AWS CLI installation
          ansible.builtin.command: "{{ aws_cli_bin }} --version"
          register: aws_cli_version
          changed_when: false

        - name: Configure default AWS Region
          ansible.builtin.command: "{{ aws_cli_bin }} configure set region {{ aws_default_region }}"
          changed_when: false

        - name: Log in to AWS with browser-based authentication
          ansible.builtin.command: "{{ aws_cli_bin }} login --region {{ aws_default_region }}"
          changed_when: false

        - name: Verify AWS credentials
          ansible.builtin.command: "{{ aws_cli_bin }} sts get-caller-identity"
          register: aws_caller_identity
          changed_when: false

        - name: Configure AWS Agent Toolkit
          ansible.builtin.command: "{{ aws_cli_bin }} configure agent-toolkit --yes --region {{ aws_agent_toolkit_region }}"
          register: aws_agent_toolkit_configure
          changed_when: aws_agent_toolkit_configure.rc == 0
          failed_when: false

        - name: Configure AWS Agent Toolkit without --yes if the AWS CLI does not support it
          ansible.builtin.command: "{{ aws_cli_bin }} configure agent-toolkit --region {{ aws_agent_toolkit_region }}"
          when: aws_agent_toolkit_configure.rc != 0
          changed_when: true

        - name: Verify AWS Agent Toolkit skills catalog
          ansible.builtin.command: "{{ aws_cli_bin }} agent-toolkit list-available-skills --region {{ aws_agent_toolkit_region }}"
          changed_when: false

        - name: Save AWS guidance for Codex to AGENTS.md
          ansible.builtin.get_url:
            url: "{{ aws_agent_rules_url }}"
            dest: "{{ codex_rules_path }}"
            mode: '0644'

    - name: Ensure VS Code user configuration directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/Code/User"
        state: directory
        mode: '0700'
      when: credal_api_token | length > 0

    - name: Configure VS Code Credal custom endpoint when token is provided
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.config/Code/User/chatLanguageModels.json"
        mode: '0600'
        content: "{{ credal_language_models | to_nice_json }}\n"
      no_log: true
      when: credal_api_token | length > 0

    - name: Display Post-Installation Guidelines
      ansible.builtin.debug:
        msg: "{{ post_install_guidelines.split('\n') }}"
